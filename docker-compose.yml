services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MLAGENT_DATA_DIR=/app/var
    env_file:
      - path: ./.env
        required: false
    volumes:
      - mlagent-data:/app/var       # datasets, models, SQLite database
      - ./data:/data:ro              # sample datasets
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mlagent-data:

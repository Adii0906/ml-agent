<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML-Agent · ML workspace</title>
    <meta name="description" content="Explore datasets, train and compare models, and generate reproducible experiment reports." />
    <meta name="theme-color" content="#f5f4f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the stored theme before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('mlagent.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f0f0e' : '#f5f4f0');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

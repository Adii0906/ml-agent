[project]
name = "ml-agent"
version = "2.0.0"
description = "ML-Agent: a workspace for dataset exploration, leak-free model experiments and reproducible reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyarrow>=14",
    "requests>=2.31",
    "groq>=0.9",
    "arxiv>=2.1",
    "xgboost>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
